name: Menu
version: '${version}'
main: com.mrfermz.mcplugins.menu.MenuPlugin
api-version: '1.21'
author: Mr.Fermz
description: Per-player menu — an in-game UI for options other plugins expose.
depend: [Core]

commands:
  menu:
    description: Open your personal menu.
    usage: /menu
    aliases: [settings, options, prefs]

permissions:
  menu.use:
    description: Open the menu.
    default: true
